# ============================================================
# LOCAL DEV CONFIG (committed to git)
# Run with profile: --spring.profiles.active=example
#   e.g. mvn spring-boot:run -Dspring-boot.run.profiles=example
#        or IDEA: Run Config -> Active profiles = example
# Note: application.yml is the deploy config (git-ignored, packed in jar).
#       This file is for local dev only and is NOT packed into jar.
# ============================================================
server:
  port: 8080

spring:
  application:
    name: interview-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/interview?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: rootlcl
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      password: java
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  mail:
    host: smtp.qq.com
    port: 465
    username: your_qq_email@qq.com
    password: your_qq_smtp_auth_code
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: 3
  token-style: uuid
  is-log: false

app:
  code:
    ttl-minutes: 5
    max-tries: 5
    resend-seconds: 60
    daily-limit: 10
    mock: true
  view:
    flush-interval-ms: 60000

logging:
  level:
    com.interview: info
